<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Neon Waveform Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Play Icon Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Subtle Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#neonGlow)" stroke-width="10" filter="url(#glow)"/>

  <!-- Concentric Resonance Sound Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#10b981" stroke-width="3.5" opacity="0.45"/>

  <!-- Audio Equalizer Spectrum Bars (Soundboard cues) -->
  <g fill="url(#neonGlow)" opacity="0.9">
    <!-- Left Equalizer Bars -->
    <rect x="96" y="226" width="12" height="60" rx="6"/>
    <rect x="120" y="196" width="12" height="120" rx="6"/>
    <rect x="144" y="166" width="12" height="180" rx="6"/>
    <rect x="168" y="210" width="12" height="92" rx="6"/>
    
    <!-- Right Equalizer Bars -->
    <rect x="332" y="210" width="12" height="92" rx="6"/>
    <rect x="356" y="166" width="12" height="180" rx="6"/>
    <rect x="380" y="196" width="12" height="120" rx="6"/>
    <rect x="404" y="226" width="12" height="60" rx="6"/>
  </g>

  <!-- Center Stage Trigger Disc -->
  <circle cx="256" cy="256" r="68" fill="#0f172a" stroke="url(#playGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Play Pulse Triangle -->
  <polygon points="244,224 284,256 244,288" fill="url(#playGrad)"/>
</svg>
