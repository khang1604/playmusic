[package]
name = "playmusic"
version = "1.0.13"
description = "Live Event Audio Cue & Polyphonic Soundboard Workstation"
authors = ["PlayMusic Studio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
