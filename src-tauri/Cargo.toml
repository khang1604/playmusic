[package]
name = "playmusic"
version = "1.0.0"
description = "Live Event Audio Cue & Polyphonic Soundboard Workstation"
authors = ["PlayMusic Studio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.12", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
