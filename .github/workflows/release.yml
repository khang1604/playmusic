name: Release Cross-Platform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-app:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
          - platform: 'windows-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ubuntu Dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            fuse3 \
            xdg-utils

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Global Tauri CLI & Dependencies
        run: |
          npm install -g @tauri-apps/cli@^2
          npm install
          npm --prefix frontend install
          npm --prefix frontend run build

      - name: Build Tauri Desktop Installers (.deb, .AppImage, .exe, .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PlayMusic Studio ${{ github.ref_name }}'
          releaseBody: 'PlayMusic Studio - Live Event Audio Workstation for Windows and Ubuntu Linux.'
          releaseDraft: false
          prerelease: false
